<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">
    <h2 class="mb-3">Car Details</h2>
    
    <table class="table table-bordered">
        <tbody>
            <tr><th>ID</th><td id="car-id"></td></tr>
            <tr><th>VIN</th><td id="car-vin"></td></tr>
            <tr><th>Make</th><td id="car-make"></td></tr>
            <tr><th>Model</th><td id="car-model"></td></tr>
            <tr><th>Year</th><td id="car-year"></td></tr>
            <tr><th>Engine</th><td><a href="#" id="engine-link"></a></td></tr>
        </tbody>
    </table>

    <a href="index.html" class="btn btn-secondary">Back to List</a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const carId = params.get("id");

            if (!carId) {
                alert("Car ID not provided!");
                window.location.href = "index.html";
                return;
            }

            fetch(`/api/cars/${carId}`)
                .then(response => response.json())
                .then(car => {
                    document.getElementById("car-id").textContent = car.id;
                    document.getElementById("car-vin").textContent = car.vin;
                    document.getElementById("car-make").textContent = car.make;
                    document.getElementById("car-model").textContent = car.model;
                    document.getElementById("car-year").textContent = car.manufacturingYear;

                    const engineLink = document.getElementById("engine-link");
                    engineLink.textContent = `Engine ${car.engine.id}`;
                    engineLink.href = `engine.html?id=${car.engine.id}`;
                })
                .catch(error => {
                    console.error("Error fetching car details:", error);
                    alert("Car not found!");
                    window.location.href = "index.html";
                });
        });
    </script>
</body>
</html>
